name: Build MP3 embedding test

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build harmless test executable
        run: |
          set -euxo pipefail
          mkdir -p output
          c++ -std=c++17 -O2 -s src/payload_test.cpp -o output/payload_test
      - name: Embed executable bytes into MP3 fixture
        run: python3 scripts/build_teeth.py
      - name: Verify output exists
        run: |
          set -euxo pipefail
          test -s output/teeth.mp3
          file output/teeth.mp3
          sha256sum output/teeth.mp3
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: teeth-mp3-test
          path: output/teeth.mp3
          if-no-files-found: error
