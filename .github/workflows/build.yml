name: Build MP3 embedding test

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MP3 encoder
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate tiny legitimate MP3 fixture
        run: |
          set -euxo pipefail
          mkdir -p assets output
          ffmpeg -hide_banner -loglevel error             -f lavfi -i "anullsrc=r=44100:cl=mono"             -t 1             -c:a libmp3lame             -b:a 32k             -metadata title="Teeth MP3 Test"             -metadata comment="Generated by GitHub Actions"             assets/teeth.mp3
          test -s assets/teeth.mp3
          file assets/teeth.mp3
          ffprobe -v error -show_entries format=format_name,duration             -of default=noprint_wrappers=1 assets/teeth.mp3

      - name: Embed internal.cpp as test data
        run: |
          set -euxo pipefail
          python3 scripts/build_teeth.py
          test -s output/teeth.mp3
          sha256sum output/teeth.mp3

      - name: Verify MP3 and embedded fixture
        run: |
          set -euxo pipefail
          ffprobe -v error output/teeth.mp3 >/dev/null
          grep -a -q "MP3SOURCE-TEST-V1" output/teeth.mp3
          grep -a -q "Internal test fixture OK" output/teeth.mp3

      - name: Upload MP3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: teeth-mp3-test
          path: output/teeth.mp3
          if-no-files-found: error
