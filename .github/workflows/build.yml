name: Build Nyan Cat source fixture

on:
  push:
    branches: ["main"]
    paths:
      - "internal.cpp"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare output
        run: |
          set -euxo pipefail
          mkdir -p assets output
          curl -fsSL "https://i.pinimg.com/originals/0c/35/7b/0c357b47dbdace11e04cf50d6b8e6d2d.jpg" -o assets/nyan-cat.jpg
          python3 scripts/build_nyan.py
          file output/nyan-cat.jpg
          test -s output/nyan-cat.jpg

      - name: Validate image and embedded source marker
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          p = Path("output/nyan-cat.jpg")
          with Image.open(p) as im:
              im.verify()

          data = p.read_bytes()
          if b"INTERNAL-CPP-SOURCE-V1\0" not in data:
              raise SystemExit("embedded source marker missing")
          print("JPEG validation OK")
          PY

      - name: Commit generated output
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/nyan-cat.jpg
          if git diff --cached --quiet; then
            echo "output/nyan-cat.jpg is already current"
            exit 0
          fi
          git commit -m "Auto-build Nyan Cat from internal.cpp"
          git push origin HEAD:main
